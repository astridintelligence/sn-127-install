services:
  validator:
    image: astridintelligence/astrid-validator:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ARENA_API_URL: ${ARENA_API_URL:-https://arena-api.astrid.global}
      VALIDATOR_MNEMONIC: ${VALIDATOR_MNEMONIC}
      VALIDATOR_SECRET_SEED: ${VALIDATOR_SECRET_SEED}
      VALIDATOR_SS58_ADDRESS: ${VALIDATOR_SS58_ADDRESS}
      VALIDATOR_SS58_FORMAT: ${VALIDATOR_SS58_FORMAT:-42}
      BITTENSOR_ENABLED: ${BITTENSOR_ENABLED:-true}
      BITTENSOR_WS_ENDPOINT: ${BITTENSOR_WS_ENDPOINT:-wss://entrypoint-finney.opentensor.ai:443}
      BITTENSOR_WEIGHT_INTERVAL_MS: ${BITTENSOR_WEIGHT_INTERVAL_MS:-3600000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    profiles: ["ops"]
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup --label-enable
